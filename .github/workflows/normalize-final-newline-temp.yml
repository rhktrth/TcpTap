name: Normalize final newlines (temporary)

on:
  push:
    branches:
      - chore/final-newline-20260829

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Normalize Java and Markdown files
        shell: python
        run: |
          from pathlib import Path

          extensions = {'.java', '.md'}
          excluded_dirs = {'.git', 'target', 'build', 'dist', 'node_modules', '.venv', 'venv', '__pycache__'}

          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue
              if any(part in excluded_dirs for part in path.parts):
                  continue
              data = path.read_bytes()
              if not data or b'\0' in data or data.endswith(b'\n'):
                  continue
              path.write_bytes(data + b'\n')
              print(path.as_posix())
      - name: Commit normalized files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No files needed normalization."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore: normalize final newlines"
          git push
