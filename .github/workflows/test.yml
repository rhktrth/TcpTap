name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - 'AGENTS.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'AGENTS.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '25']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify
        run: mvn -B -ntp verify
      - name: Smoke test executable JAR
        run: java -jar target/TcpTap.jar --help
